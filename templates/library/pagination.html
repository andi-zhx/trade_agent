{% if page.pages > 1 %}<nav class="pagination-bar" aria-label="分页">{% if page.has_prev %}<a class="btn btn-outline-secondary" href="{{ url_for(request.endpoint, page=page.prev_num, q=keyword) }}">上一页</a>{% endif %}<span>第 {{ page.page }} / {{ page.pages }} 页</span>{% if page.has_next %}<a class="btn btn-outline-secondary" href="{{ url_for(request.endpoint, page=page.next_num, q=keyword) }}">下一页</a>{% endif %}</nav>{% endif %}
