{% extends 'base.html' %}{% block title %}修改密码
{% endblock %}{% block content %}
<form class="record-card entry-container" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% for name, label in [('current_password', '当前密码'), ('new_password', '新密码'), ('confirm_password', '再输入一次新密码')] %}<div class="mb-3">
<label class="form-label" for="{{ name }}">{{ label }}</label>
<input class="form-control" id="{{ name }}" name="{{ name }}" type="password" required autocomplete="{{ 'current-password' if name == 'current_password' else 'new-password' }}" {% if name != 'current_password' %}minlength="12" maxlength="128"{% endif %}>
</div>{% endfor %}<p class="text-muted small">新密码至少 12 个字符。修改后，其他设备需要重新登录。</p>
<button class="btn btn-primary">保存新密码</button>
</form>
{% endblock %}
